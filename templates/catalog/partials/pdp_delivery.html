{% load i18n %}
<div class="mb-3">
  <label class="form-label small fw-medium">{% trans "Delivery Estimate" %}</label>
  <div class="dropdown">
    <button class="form-select dropdown-toggle d-flex justify-content-between align-items-center text-start shadow-none" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="delivery-city-btn">
      <span id="delivery-city-label">{% if delivery_estimate %}{{ delivery_estimate.city }}{% else %}{% trans "Select a city" %}{% endif %}</span>
    </button>
    <ul class="dropdown-menu w-100 shadow-sm border-0" aria-labelledby="delivery-city-btn">
      {% for city in cities %}
      <li><a class="dropdown-item" href="#" onclick="event.preventDefault(); document.getElementById('delivery-city').value='{{ city.slug }}'; document.getElementById('delivery-city-label').textContent='{{ city.name|escapejs }}'; document.getElementById('delivery-city').dispatchEvent(new Event('change'));">{{ city.name }}</a></li>
      {% endfor %}
    </ul>
  </div>
  <select id="delivery-city" class="d-none" data-estimate-url="{% url 'catalog:delivery-estimate' product_id=product.pk %}">
    {% for city in cities %}
    <option value="{{ city.slug }}" {% if delivery_estimate.city == city.name %}selected{% endif %}>{{ city.name }}</option>
    {% endfor %}
  </select>
  <p id="delivery-estimate-text" class="small text-muted mt-2 mb-0">
    {% if delivery_estimate %}
    {% blocktrans with label=delivery_estimate.label city=delivery_estimate.city %}Delivery: {{ label }} to {{ city }}{% endblocktrans %}
    {% else %}{% trans "Select a city" %}{% endif %}
  </p>
</div>
