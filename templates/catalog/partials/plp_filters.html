{% load i18n %}
<form class="plp-filters card p-3" method="get" action="{{ request.path }}" hx-get="{{ request.path }}"
  hx-target="#product-grid" hx-swap="innerHTML" hx-push-url="true" hx-indicator="#product-grid"
  hx-trigger="submit">
  <h2 class="h6 plp-filters-header">{% trans "Filters" %}</h2>
  <div class="plp-filters-body">
    <div class="mb-3">
      <label class="form-label small">{% trans "Category" %}</label>
      <select name="category" class="form-select form-select-sm" onchange="const sub = this.form.querySelector('select[name=subcategory]'); if(sub) sub.value=''; this.form.action='{% url 'catalog:plp' %}';">
        <option value="">{% trans "All" %}</option>
        {% for cat in categories %}
        <option value="{{ cat.pk }}" {% if filters.category_id == cat.pk or filters.parent_category_id == cat.pk or active_category.pk == cat.pk or active_category.parent_id == cat.pk %}selected{% endif %}>{{ cat.name }}</option>
        {% endfor %}
      </select>
    </div>

    {% if subcategories %}
    <div class="mb-3">
      <label class="form-label small">{% trans "Subcategory" %}</label>
      <select name="subcategory" class="form-select form-select-sm">
        <option value="">{% trans "All Subcategories" %}</option>
        {% for sub in subcategories %}
        <option value="{{ sub.pk }}" {% if filters.subcategory_id == sub.pk %}selected{% endif %}>{{ sub.name }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}

    <div class="mb-3">
      <label class="form-label small">{% trans "Brand" %}</label>
      <select name="brand" class="form-select form-select-sm">
        <option value="">{% trans "All" %}</option>
        {% for brand in brands %}
        <option value="{{ brand.pk }}" {% if filters.brand_id == brand.pk %}selected{% endif %}>{{ brand.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label small">{% trans "Price" %}</label>
      <div class="input-group input-group-sm">
        <input type="number" name="min_price" class="form-control" placeholder="Min" value="{{ request.GET.min_price }}">
        <input type="number" name="max_price" class="form-control" placeholder="Max" value="{{ request.GET.max_price }}">
      </div>
    </div>
    <div class="form-check mb-1"><input class="form-check-input" type="checkbox" name="featured" value="1" id="f-ft" {% if filters.featured %}checked{% endif %}><label class="form-check-label small" for="f-ft">{% trans "Featured" %}</label></div>
    <div class="form-check mb-1"><input class="form-check-input" type="checkbox" name="bestseller" value="1" id="f-bs" {% if filters.bestseller %}checked{% endif %}><label class="form-check-label small" for="f-bs">{% trans "Bestseller" %}</label></div>
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="in_stock" value="1" id="f-stock" {% if filters.in_stock %}checked{% endif %}><label class="form-check-label small" for="f-stock">{% trans "In Stock" %}</label></div>
    <div class="mb-3">
      <label class="form-label small">{% trans "Sort" %}</label>
      <select name="sort" class="form-select form-select-sm">
        <option value="newest" {% if sort == 'newest' %}selected{% endif %}>{% trans "Newest" %}</option>
        <option value="price_asc" {% if sort == 'price_asc' %}selected{% endif %}>{% trans "Price: Low to High" %}</option>
        <option value="price_desc" {% if sort == 'price_desc' %}selected{% endif %}>{% trans "Price: High to Low" %}
        </option>
        <option value="rating" {% if sort == 'rating' %}selected{% endif %}>{% trans "Top Rated" %}</option>
      </select>
    </div>
  </div>
  <div class="d-flex gap-2 plp-filters-footer pt-2">
    <button type="submit" class="btn btn-floward btn-sm flex-grow-1" data-bs-dismiss="offcanvas">{% trans "Apply" %}</button>
    <a href="{% url 'catalog:plp' %}" class="btn btn-outline-secondary btn-sm flex-grow-1 text-center d-inline-flex align-items-center justify-content-center">{% trans "Clear" %}</a>
  </div>
</form>
