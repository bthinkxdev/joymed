{% extends "dashboard/crud/list.html" %}

{% block content %}
<div class="mb-4">
  <ul class="nav nav-tabs">
    <li class="nav-item">
      <a class="nav-link {% if active_tab == 'all' or not active_tab %}active fw-semibold{% endif %}" href="?tab=all{% if search_query %}&q={{ search_query }}{% endif %}">
        <i class="ti ti-users me-1"></i>All Customers
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active_tab == 'retail' %}active fw-semibold{% endif %}" href="?tab=retail{% if search_query %}&q={{ search_query }}{% endif %}">
        <i class="ti ti-user me-1"></i>Retail Customers
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if active_tab == 'wholesale' %}active fw-semibold{% endif %}" href="?tab=wholesale{% if search_query %}&q={{ search_query }}{% endif %}">
        <i class="ti ti-briefcase me-1"></i>Wholesale Customers
      </a>
    </li>
  </ul>
</div>

{{ block.super }}
{% endblock %}
